name: LanceDrop Automated Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build Windows Electron Desktop (.exe)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (.exe + portable)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # JOB 2 — Build Android APK (Release)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android Application (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Commandes SDK préinstallées sur les runners GitHub, mais hors
      # PATH ; l'acceptation des licences doit être pipée (`yes |`)
      # car le gestionnaire pose une question interactive.
      - name: Accept Android SDK licenses & ensure platform 34
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # gradle/actions/setup-gradle installe Gradle directement — pas besoin du gradlew wrapper JAR
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true   # évite les erreurs 400 du cache service

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # JOB 3 — Publier la GitHub Release officielle
  # ─────────────────────────────────────────────
  publish-release:
    name: Publish Public GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    # (plus de `if: always()` : ne pas publier une release sans artefacts)

    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files
        continue-on-error: true

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files
        continue-on-error: true

      - name: List release files
        run: ls -la release-files/ || echo "Aucun fichier à publier"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
          tag_name: ${{ github.ref_name }}
          name: LanceDrop ${{ github.ref_name }} — Release Officielle
          body: |
            ## ⚡ LanceDrop ${{ github.ref_name }}

            Transfert direct ultra-rapide de fichiers entre Android et Windows — réseau local, sans cloud.

            ### 📥 Téléchargements
            | Plateforme | Fichier | Description |
            |---|---|---|
            | 🪟 Windows | `LanceDrop-Setup-*.exe` / `LanceDrop-*.exe` | Installateur & Portable Windows 10/11 (64-bit) |
            | 🤖 Android | `LanceDrop*.apk` | APK pour Android 8+ (SAF, Zero-Permission) |

            ### 📱 QR Code Android
            Scannez pour installer directement sur mobile :
            ![QR Code](https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com/bindedouworker-hub/LanceFer/releases/latest/download/LanceDrop.apk)

            ---
            *Construit automatiquement par LanceFer Software Factory 🏭*
          draft: false
          prerelease: false
